<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: allow-user-scaling for a11y, but keep initial scale=1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />

    <!-- Browser Tab Icon / Favicon: Thinkatic T icon -->
    <link rel="icon" type="image/png" href="/Thinkatic.png" />
    <link rel="shortcut icon" type="image/png" href="/Thinkatic.png" />
    <link rel="apple-touch-icon" href="/Thinkatic.png" />

    <!-- Primary SEO (defaults — overridden per-page by useSEO hook) -->
    <title>Thinkatic — Enterprise Technology Transformation Partner</title>
    <meta name="description" content="Thinkatic helps US enterprises build, modernize, secure and operate mission-critical technology systems across AI, Cloud, Cybersecurity, Data, and Engineering." />
    <meta name="keywords" content="enterprise technology transformation, enterprise AI, cloud modernization, cybersecurity, Zero Trust, data platforms, product engineering, mission-critical systems" />
    <meta name="author" content="Thinkatic" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://thinkatic.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thinkatic" />
    <meta property="og:url" content="https://thinkatic.com/" />
    <meta property="og:title" content="Thinkatic — Enterprise Technology Transformation Partner" />
    <meta property="og:description" content="Thinkatic helps US enterprises build, modernize, secure and operate mission-critical technology systems across AI, Cloud, Cybersecurity, Data, and Engineering." />
    <meta property="og:image" content="https://thinkatic.com/opengraph.jpg" />
    <meta property="og:image:secure_url" content="https://thinkatic.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Thinkatic — Enterprise Technology Transformation Partner" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thinkatic" />
    <meta name="twitter:creator" content="@thinkatic" />
    <meta name="twitter:title" content="Thinkatic — Enterprise Technology Transformation Partner" />
    <meta name="twitter:description" content="Thinkatic helps US enterprises build, modernize, secure and operate mission-critical technology systems across AI, Cloud, Cybersecurity, Data, and Engineering." />
    <meta name="twitter:image" content="https://thinkatic.com/opengraph.jpg" />
    <meta name="twitter:image:alt" content="Thinkatic — Enterprise Technology Transformation Partner" />

    <!-- Resource hints for high-performance typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />

    <!-- Enterprise Typography System: Plus Jakarta Sans (Display) + Inter (Sans/Body) + JetBrains Mono (Technical) -->
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <!-- Inline critical CSS: prevent flash of unstyled background -->
    <style>
      html, body { background-color: #FFFFFF; color: #111827; }
      #root { min-height: 100dvh; }
      /* Skip-to-content */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 6px;
        z-index: 9999;
        padding: 8px 16px;
        border-radius: 8px;
        background: #214ECF;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: top 0.15s;
      }
      .skip-link:focus {
        top: 6px;
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
    </style>

    <!-- Structured data: Organization (global) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://thinkatic.com/#organization",
      "name": "Thinkatic",
      "url": "https://thinkatic.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://thinkatic.com/logo-transparent.png",
        "width": 200,
        "height": 60
      },
      "description": "AI-Powered Business Process Outsourcing & Enterprise Technology Solutions",
      "email": "Thinkaticai@gmail.com",
      "telephone": "+91-726-387-4459",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Tower B, Magarpatta City, Hadapsar",
        "addressLocality": "Pune",
        "addressRegion": "Maharashtra",
        "postalCode": "411028",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://www.linkedin.com/company/thinkatic",
        "https://twitter.com/thinkatic"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://thinkatic.com/#website",
      "url": "https://thinkatic.com",
      "name": "Thinkatic",
      "description": "AI-Powered BPO & Enterprise Technology Solutions"
    }
    </script>
  </head>
  <body>
    <!-- Skip to main content for keyboard/screen reader users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
