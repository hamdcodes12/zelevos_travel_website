services:
  - type: web
    name: zelevos-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://zelevos.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://zelevos.onrender.com,https://zelevos.com
      - key: HOTELBEDS_HOTEL_BASE_URL
        value: https://api.test.hotelbeds.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: IGNAV_API_KEY
        sync: false
      - key: HOTELBEDS_HOTEL_API_KEY
        sync: false
      - key: HOTELBEDS_HOTEL_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
