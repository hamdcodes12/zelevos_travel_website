services:
  - type: web
    name: zelevos-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://zelevos.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://zelevos.com
      - key: HOTELBEDS_HOTEL_BASE_URL
        value: https://api.test.hotelbeds.com
