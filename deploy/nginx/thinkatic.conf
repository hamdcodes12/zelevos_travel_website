# ==============================================================================
# DEPRECATED — VPS DEPLOYMENT ONLY
# THINKATIC ARCHITECTURE HAS FULLY MIGRATED TO SUPABASE (DATABASE & STORAGE).
# Persistent storage and database are now handled by Supabase (kajeoxbyyokauddoiumf).
# This configuration file is retained for reference only.
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=thinkatic_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=thinkatic_upload_limit:10m rate=5r/s;

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name thinkatic.com www.thinkatic.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thinkatic.com www.thinkatic.com;

    # SSL Certificates (managed via Certbot or custom certs)
    ssl_certificate /etc/letsencrypt/live/thinkatic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkatic.com/privkey.pem;

    # Modern TLS configuration (A+ on SSLLabs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;" always;

    # Client Request & Body Limits (100MB for video evidence and signed PDFs)
    client_max_body_size 100M;
    client_body_buffer_size 16M;
    client_header_timeout 30s;
    client_body_timeout 120s;
    send_timeout 120s;

    # CRITICAL: Deny direct external access to storage directory or hidden files
    location ^~ /storage/ {
        deny all;
        return 403;
    }

    location ^~ /data/ {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Static assets caching (served by Node / SPA)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media uploads route with dedicated upload rate limiter
    location ~ ^/api/bpo/(centre-verification/upload-evidence|agreement/upload-signed) {
        limit_req zone=thinkatic_upload_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # API Routes with rate limiting
    location /api/ {
        limit_req zone=thinkatic_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend SPA / Root
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
